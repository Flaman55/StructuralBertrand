      lean: "StructuralBertrand.structural_bertrand_chebyshev"
      module: "StructuralBertrand/Main.lean"
      status: "proved"
      note: ""
    - source: "Corollary 6.1 (Classical Bertrand-Chebyshev)"
      lean: "StructuralBertrand.bertrand_chebyshev"
      module: "StructuralBertrand/Main.lean"
      status: "proved"
      note: "Main result; also restated in Challenge.lean/Solution.lean as Submission.bertrand_chebyshev"
    - source: "Jacobsthal gap bound, g(210) = 10"
      lean: "StructuralBertrand.jacobsthal_210"
      module: "StructuralBertrand/Rings.lean"
      status: "proved"
      note: "Chunked kernel-checked decide"
    - source: "Jacobsthal gap bound, g(2310) = 14"
      lean: "StructuralBertrand.jacobsthal_2310"
      module: "StructuralBertrand/Rings.lean"
      status: "proved"
      note: "11 chunks of width 210, glued; replaces an earlier native_decide"
    - source: "Small-window oracle (n < 512)"
